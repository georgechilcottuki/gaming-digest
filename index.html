            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f6f8;
            color: #1a1a1a;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            padding: 30px 0;
            overflow-y: auto;
        }

        .sidebar-section {
            margin-bottom: 40px;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #6b7280;
            letter-spacing: 0.5px;
            padding: 0 24px;
            margin-bottom: 16px;
        }

        .sidebar-item {
            padding: 12px 24px;
            font-size: 14px;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sidebar-item:hover {
            background: #f3f4f6;
            color: #1a1a1a;
        }

        .sidebar-item.active {
            background: #f3f4f6;
            color: #1a1a1a;
            font-weight: 600;
            border-left: 3px solid #2563eb;
            padding-left: 21px;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header {
            margin-bottom: 40px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .header-subtitle {
            font-size: 14px;
            color: #2563eb;
            margin-top: 4px;
        }

        .generate-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .generate-btn:hover {
            background: #1d4ed8;
        }

        .generate-btn:active {
            transform: scale(0.98);
        }

        /* BRAND TABS */
        .brand-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            border-bottom: 1px solid #e5e7eb;
            flex-wrap: wrap;
        }

        .brand-tab {
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: #6b7280;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .brand-tab.active {
            color: #1a1a1a;
            border-bottom-color: #2563eb;
        }

        .brand-tab:hover {
            color: #1a1a1a;
        }

        /* FILTERS */
        .filters {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-label {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
        }

        .filter-select {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* STOCK HEADER */
        .stock-header {
            background: white;
            border-radius: 8px;
            padding: 32px;
            margin-bottom: 32px;
            border: 1px solid #e5e7eb;
        }

        .stock-header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .stock-info h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .stock-info p {
            font-size: 14px;
            color: #6b7280;
        }

        .stock-price {
            text-align: right;
        }

        .stock-price-value {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .stock-price-change {
            font-size: 16px;
            font-weight: 700;
        }

        .stock-price-change.positive {
            color: #22c55e;
        }

        .stock-price-change.negative {
            color: #ef4444;
        }

        .stock-performance {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .performance-metric {
            padding: 16px;
            background: #f9fafb;
            border-radius: 6px;
        }

        .performance-label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .performance-value {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
        }

        /* KEY METRICS */
        .metrics-section {
            background: white;
            border-radius: 8px;
            padding: 32px;
            margin-bottom: 32px;
            border: 1px solid #e5e7eb;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 20px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .metric-item {
            padding: 16px;
            background: #f9fafb;
            border-radius: 6px;
        }

        .metric-item-label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .metric-item-value {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
        }

        /* NEWS SECTION */
        .news-section {
            background: white;
            border-radius: 8px;
            padding: 32px;
            margin-bottom: 32px;
            border: 1px solid #e5e7eb;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .news-item {
            padding: 16px;
            background: #f9fafb;
            border-radius: 6px;
            border-left: 3px solid #2563eb;
        }

        .news-date {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .news-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .news-summary {
            font-size: 13px;
            color: #4b5563;
            line-height: 1.5;
        }

        /* ANALYSIS SECTION */
        .analysis-section {
            background: white;
            border-radius: 8px;
            padding: 32px;
            margin-bottom: 32px;
            border: 1px solid #e5e7eb;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }

        .analysis-block h3 {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .analysis-block ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .analysis-block li {
            font-size: 14px;
            color: #4b5563;
            line-height: 1.5;
            padding-left: 20px;
            position: relative;
        }

        .analysis-block li:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #2563eb;
            font-weight: 700;
        }

        .narrative-section {
            background: #f0f7ff;
            border-left: 3px solid #2563eb;
            padding: 20px;
            border-radius: 6px;
            margin-top: 24px;
        }

        .narrative-title {
            font-size: 13px;
            font-weight: 700;
            color: #2563eb;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .narrative-text {
            font-size: 14px;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        @media (max-width: 1024px) {
            .sidebar {
                width: 240px;
            }

            .analysis-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
                padding: 20px;
                display: none;
            }

            .main-content {
                padding: 16px;
            }

            .stock-header-top {
                flex-direction: column;
            }

            .stock-price {
                text-align: left;
                margin-top: 16px;
            }
        }
    </style>
</head>

        let activeStock = "DKNG";

        function initBrandTabs() {
            const tabsContainer = document.getElementById('brandTabs');
            Object.keys(stocksData).forEach(ticker => {
                const tab = document.createElement('button');
                tab.className = `brand-tab ${ticker === activeStock ? 'active' : ''}`;
                tab.textContent = ticker;
                tab.onclick = () => {
                    activeStock = ticker;
                    document.querySelectorAll('.brand-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    displayStockDashboard(ticker);
                };
                tabsContainer.appendChild(tab);
            });
        }

        function generateDigest() {
            const btn = document.querySelector('.generate-btn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            btn.disabled = true;
            loading.style.display = 'block';
            results.style.display = 'none';

            setTimeout(() => {
                displayStockDashboard(activeStock);
                btn.disabled = false;
                loading.style.display = 'none';
                results.style.display = 'block';
            }, 800);
        }

        function displayStockDashboard(ticker) {
            const stock = stocksData[ticker];

            // Stock Header
            const stockHeader = document.getElementById('stockHeader');
            stockHeader.innerHTML = `
                <div class="stock-header-top">
                    <div class="stock-info">
                        <h2>${stock.name}</h2>
                        <p>${stock.exchange}</p>
                    </div>
                    <div class="stock-price">
                        <div class="stock-price-value">$${stock.price.toFixed(2)}</div>
                        <div class="stock-price-change ${stock.change_pct >= 0 ? 'positive' : 'negative'}">
                            ${stock.change_pct > 0 ? '+' : ''}${stock.change_pct.toFixed(2)}% (${stock.change_pct > 0 ? '+' : ''}${stock.change_abs.toFixed(2)})
                        </div>
                    </div>
                </div>
                <div class="stock-performance">
                    <div class="performance-metric">
                        <div class="performance-label">WOW</div>
                        <div class="performance-value ${stock.wow >= 0 ? 'positive' : 'negative'}">
                            ${stock.wow > 0 ? '+' : ''}${stock.wow.toFixed(2)}%
                        </div>
                    </div>
                    <div class="performance-metric">
                        <div class="performance-label">L4W</div>
                        <div class="performance-value ${stock.l4w >= 0 ? 'positive' : 'negative'}">
                            ${stock.l4w > 0 ? '+' : ''}${stock.l4w.toFixed(2)}%
                        </div>
                    </div>
                    <div class="performance-metric">
                        <div class="performance-label">L12W</div>
                        <div class="performance-value ${stock.l12w >= 0 ? 'positive' : 'negative'}">
                            ${stock.l12w > 0 ? '+' : ''}${stock.l12w.toFixed(2)}%
                        </div>
                    </div>
                </div>
            `;

            // Key Metrics
            const metricsGrid = document.getElementById('metricsGrid');
            metricsGrid.innerHTML = `
                <div class="metric-item">
                    <div class="metric-item-label">Market Cap</div>
                    <div class="metric-item-value">${stock.market_cap}</div>
                </div>
                <div class="metric-item">
                    <div class="metric-item-label">Volume</div>
                    <div class="metric-item-value">${stock.volume}</div>
                </div>
                <div class="metric-item">
                    <div class="metric-item-label">52W High</div>
                    <div class="metric-item-value">${stock.week_52_high}</div>
                </div>
                <div class="metric-item">
                    <div class="metric-item-label">52W Low</div>
                    <div class="metric-item-value">${stock.week_52_low}</div>
                </div>
            `;

            // News
            const newsList = document.getElementById('newsList');
            newsList.innerHTML = stock.news.map(item => `
                <div class="news-item">
                    <div class="news-date">${item.date}</div>
                    <div class="news-title">${item.title}</div>
                    <div class="news-summary">${item.summary}</div>
                </div>
            `).join('');

            // Analysis
            const analysisGrid = document.getElementById('analysisGrid');
            analysisGrid.innerHTML = `
                <div class="analysis-block">
                    <h3>Tailwinds ✈️</h3>
                    <ul>
                        ${stock.tailwinds.map(item => `<li>${item}</li>`).join('')}
                    </ul>
                </div>
                <div class="analysis-block">
                    <h3>Headwinds ⛈️</h3>
                    <ul>
                        ${stock.headwinds.map(item => `<li>${item}</li>`).join('')}
                    </ul>
                </div>
            `;

            // Narrative
            const narrativeSection = document.getElementById('narrativeSection');
            narrativeSection.innerHTML = `
                <div class="narrative-title">Performance Narrative</div>
                <div class="narrative-text">${stock.narrative}</div>
            `;
        }

        // Initialize on load
        window.addEventListener('load', () => {
            initBrandTabs();
            displayStockDashboard(activeStock);
        });
    </script>
</body>
</html>
