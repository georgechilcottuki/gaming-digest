<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Market Pulse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f5f6f8;
            color: #1a1a1a;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            padding: 30px 0;
            overflow-y: auto;
        }

        .sidebar-section {
            margin-bottom: 40px;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #6b7280;
            letter-spacing: 0.5px;
            padding: 0 24px;
            margin-bottom: 16px;
        }

        .sidebar-item {
            padding: 12px 24px;
            font-size: 14px;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sidebar-item:hover {
            background: #f3f4f6;
            color: #1a1a1a;
        }

        .sidebar-item.active {
            background: #f3f4f6;
            color: #1a1a1a;
            font-weight: 600;
            border-left: 3px solid #2563eb;
            padding-left: 21px;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header {
            margin-bottom: 40px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .header-subtitle {
            font-size: 14px;
            color: #2563eb;
            margin-top: 4px;
        }

        .generate-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .generate-btn:hover {
            background: #1d4ed8;
        }

        .generate-btn:active {
            transform: scale(0.98);
        }

        /* BRAND TABS */
        .brand-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            border-bottom: 1px solid #e5e7eb;
            flex-wrap: wrap;
        }

        .brand-tab {
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: #6b7280;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .brand-tab.active {
            color: #1a1a1a;
            border-bottom-color: #2563eb;
        }

        .brand-tab:hover {
            color: #1a1a1a;
        }

        /* FILTERS */
        .filters {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-label {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
        }

        .filter-select {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-select:hover {
            border-color: #9ca3af;
        }

        /* SUMMARY SECTION */
        .summary-section {
            background: white;
            border-radius: 8px;
            padding: 32px;
            margin-bottom: 32px;
            border: 1px solid #e5e7eb;
        }

        .summary-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 24px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .metric-card {
            padding: 20px;
            background: #f9fafb;
            border-radius: 6px;
            border: 1px solid #f3f4f6;
        }

        .metric-label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .metric-changes {
            display: flex;
            gap: 20px;
            font-size: 13px;
        }

        .metric-change {
            display: flex;
            flex-direction: column;
        }

        .change-label {
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .change-value {
            font-weight: 700;
        }

        .change-value.positive {
            color: #22c55e;
        }

        .change-value.negative {
            color: #ef4444;
        }

        /* STOCKS TABLE */
        .stocks-section {
            background: white;
            border-radius: 8px;
            padding: 32px;
            border: 1px solid #e5e7eb;
        }

        .stocks-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 24px;
        }

        .stocks-table {
            width: 100%;
            border-collapse: collapse;
        }

        .stocks-table thead {
            background: #f9fafb;
            border-bottom: 2px solid #e5e7eb;
        }

        .stocks-table th {
            padding: 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stocks-table td {
            padding: 16px;
            border-bottom: 1px solid #f3f4f6;
            font-size: 14px;
        }

        .stocks-table tbody tr:hover {
            background: #f9fafb;
        }

        .ticker-cell {
            font-weight: 700;
            color: #1a1a1a;
        }

        .company-cell {
            color: #6b7280;
        }

        .price-cell {
            font-weight: 700;
            color: #1a1a1a;
        }

        .change-cell {
            text-align: right;
            font-weight: 700;
        }

        .change-cell.positive {
            color: #22c55e;
        }

        .change-cell.negative {
            color: #ef4444;
        }

        /* ANALYSIS SECTION */
        .analysis-section {
            background: white;
            border-radius: 8px;
            padding: 32px;
            border: 1px solid #e5e7eb;
            margin-top: 32px;
        }

        .analysis-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 24px;
        }

        .analysis-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .analysis-column h3 {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .analysis-column ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .analysis-column li {
            font-size: 14px;
            color: #4b5563;
            line-height: 1.5;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        @media (max-width: 1024px) {
            .sidebar {
                width: 240px;
            }

            .main-content {
                padding: 24px;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .analysis-content {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
                padding: 20px;
                display: none;
            }

            .main-content {
                padding: 16px;
            }

            .brand-tabs {
                overflow-x: auto;
            }

            .stocks-table {
                font-size: 12px;
            }

            .stocks-table th,
            .stocks-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Primary</div>
                <div class="sidebar-item active">Dashboard</div>
                <div class="sidebar-item">Trends</div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Analysis</div>
                <div class="sidebar-item">Performance</div>
                <div class="sidebar-item">Movers</div>
                <div class="sidebar-item">Sector View</div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Resources</div>
                <div class="sidebar-item">Documentation</div>
                <div class="sidebar-item">About</div>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- HEADER -->
            <div class="header">
                <div class="header-top">
                    <div>
                        <div class="header-title">Gaming Market Pulse</div>
                        <div class="header-subtitle" id="headerDate">W/c 28/08/2026</div>
                    </div>
                    <button class="generate-btn" onclick="generateDigest()">Generate Report</button>
                </div>
            </div>

            <!-- BRAND TABS -->
            <div class="brand-tabs" id="brandTabs"></div>

            <!-- FILTERS -->
            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label">Week</label>
                    <select class="filter-select">
                        <option>W/c 28/08/2026</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">View</label>
                    <select class="filter-select">
                        <option>All Data</option>
                    </select>
                </div>
            </div>

            <!-- LOADING -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Generating report...</p>
            </div>

            <!-- RESULTS -->
            <div class="results" id="results">
                <!-- SUMMARY -->
                <div class="summary-section">
                    <div class="summary-title" id="summaryTitle">Market Summary</div>
                    <div class="summary-grid" id="summaryGrid"></div>
                </div>

                <!-- STOCKS TABLE -->
                <div class="stocks-section">
                    <div class="stocks-title">All Stocks</div>
                    <table class="stocks-table">
                        <thead>
                            <tr>
                                <th>Ticker</th>
                                <th>Company</th>
                                <th style="text-align: right;">Price</th>
                                <th style="text-align: right;">Change</th>
                                <th style="text-align: right;">% Change</th>
                            </tr>
                        </thead>
                        <tbody id="stocksBody"></tbody>
                    </table>
                </div>

                <!-- ANALYSIS -->
                <div class="analysis-section">
                    <div class="analysis-title">Market Analysis</div>
                    <div class="analysis-content" id="analysisContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const stocks = {
            "DKNG": {
                name: "DraftKings",
                price: 24.22,
                change_pct: -2.26,
                change_abs: -0.56,
            },
            "FLUT": {
                name: "Flutter Entertainment",
                price: 95.01,
                change_pct: -3.11,
                change_abs: -3.05,
            },
            "EVOK.L": {
                name: "Evoke plc",
                price: 46.40,
                change_pct: 0.87,
                change_abs: 0.40,
            },
            "BALY": {
                name: "Bally's Corporation",
                price: 9.10,
                change_pct: 0.11,
                change_abs: 0.01,
            },
            "SGHC": {
                name: "Super Group (Betway)",
                price: 13.31,
                change_pct: 0.00,
                change_abs: 0.00,
            },
            "ENT.L": {
                name: "Entain",
                price: 560.00,
                change_pct: 0.00,
                change_abs: 0.00,
            }
        };

        let activeStock = "DKNG";

        function initBrandTabs() {
            const tabsContainer = document.getElementById('brandTabs');
            Object.keys(stocks).forEach(ticker => {
                const tab = document.createElement('button');
                tab.className = `brand-tab ${ticker === activeStock ? 'active' : ''}`;
                tab.textContent = ticker;
                tab.onclick = () => selectStock(ticker);
                tabsContainer.appendChild(tab);
            });
        }

        function selectStock(ticker) {
            activeStock = ticker;
            document.querySelectorAll('.brand-tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent === ticker);
            });
        }

        function generateDigest() {
            const btn = document.querySelector('.generate-btn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            btn.disabled = true;
            loading.style.display = 'block';
            results.style.display = 'none';

            setTimeout(() => {
                displayDigest();
                btn.disabled = false;
                loading.style.display = 'none';
                results.style.display = 'block';
            }, 800);
        }

        function displayDigest() {
            // Calculate metrics
            const changes = Object.values(stocks).map(s => s.change_pct);
            const avgChange = changes.reduce((a, b) => a + b, 0) / changes.length;
            const gainers = changes.filter(c => c > 0).length;
            const losers = changes.filter(c => c < 0).length;

            // Summary cards
            const summaryGrid = document.getElementById('summaryGrid');
            summaryGrid.innerHTML = `
                <div class="metric-card">
                    <div class="metric-label">NGR</div>
                    <div class="metric-value">£235M</div>
                    <div class="metric-changes">
                        <div class="metric-change">
                            <div class="change-label">WOW</div>
                            <div class="change-value negative">▼ ${Math.abs(avgChange).toFixed(2)}%</div>
                        </div>
                        <div class="metric-change">
                            <div class="change-label">L4W</div>
                            <div class="change-value negative">▼ 5.2%</div>
                        </div>
                        <div class="metric-change">
                            <div class="change-label">L12W</div>
                            <div class="change-value negative">▼ 8.1%</div>
                        </div>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Sector Direction</div>
                    <div class="metric-value">${avgChange > 0 ? '📈 UP' : '📉 DOWN'}</div>
                    <div class="metric-changes">
                        <div class="metric-change">
                            <div class="change-label">Gainers</div>
                            <div class="change-value positive">${gainers}</div>
                        </div>
                        <div class="metric-change">
                            <div class="change-label">Losers</div>
                            <div class="change-value negative">${losers}</div>
                        </div>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Avg Change</div>
                    <div class="metric-value ${avgChange < 0 ? 'negative' : 'positive'}">${avgChange > 0 ? '+' : ''}${avgChange.toFixed(2)}%</div>
                    <div class="metric-changes">
                        <div class="metric-change">
                            <div class="change-label">Range</div>
                            <div class="change-value">${Math.min(...changes).toFixed(2)}% to ${Math.max(...changes).toFixed(2)}%</div>
                        </div>
                    </div>
                </div>
            `;

            // Stocks table
            const stocksBody = document.getElementById('stocksBody');
            stocksBody.innerHTML = Object.entries(stocks).map(([ticker, data]) => `
                <tr>
                    <td class="ticker-cell">${ticker}</td>
                    <td class="company-cell">${data.name}</td>
                    <td class="price-cell" style="text-align: right;">$${data.price.toFixed(2)}</td>
                    <td class="change-cell ${data.change_pct >= 0 ? 'positive' : 'negative'}" style="text-align: right;">
                        ${data.change_pct > 0 ? '+' : ''}${data.change_abs.toFixed(2)}
                    </td>
                    <td class="change-cell ${data.change_pct >= 0 ? 'positive' : 'negative'}" style="text-align: right;">
                        ${data.change_pct > 0 ? '+' : ''}${data.change_pct.toFixed(2)}%
                    </td>
                </tr>
            `).join('');

            // Analysis
            const analysisContent = document.getElementById('analysisContent');
            analysisContent.innerHTML = `
                <div class="analysis-column">
                    <h3>Headwinds</h3>
                    <ul>
                        <li>Regulatory pressures (UK gaming taxes)</li>
                        <li>Slowing US sportsbook growth</li>
                        <li>Margin compression from promotions</li>
                        <li>Leadership transitions</li>
                    </ul>
                </div>
                <div class="analysis-column">
                    <h3>Tailwinds</h3>
                    <ul>
                        <li>NFL partnerships & sports betting expansion</li>
                        <li>World Cup betting volume increases</li>
                        <li>M&A consolidation opportunities</li>
                        <li>AI-driven player retention improvements</li>
                    </ul>
                </div>
            `;
        }

        // Initialize on load
        window.addEventListener('load', () => {
            initBrandTabs();
        });
    </script>
</body>
</html>
