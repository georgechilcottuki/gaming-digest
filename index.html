<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Gaming Market Daily Digest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .control-panel {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .metric-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .metric-value.bullish {
            color: #22c55e;
        }

        .metric-value.bearish {
            color: #ef4444;
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .section h2 {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .movers-list {
            display: grid;
            gap: 15px;
        }

        .mover {
            padding: 15px;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mover.positive {
            border-left-color: #22c55e;
        }

        .mover.negative {
            border-left-color: #ef4444;
        }

        .mover-info {
            flex: 1;
        }

        .mover-ticker {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }

        .mover-company {
            font-size: 0.9em;
            color: #666;
        }

        .mover-stats {
            text-align: right;
        }

        .mover-price {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
        }

        .mover-change {
            font-size: 0.95em;
            font-weight: 600;
        }

        .mover-change.positive {
            color: #22c55e;
        }

        .mover-change.negative {
            color: #ef4444;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        thead {
            background: #f5f5f5;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        tr:hover {
            background: #fafafa;
        }

        .ticker-col {
            font-weight: 600;
            color: #667eea;
        }

        .positive-value {
            color: #22c55e;
            font-weight: 600;
        }

        .negative-value {
            color: #ef4444;
            font-weight: 600;
        }

        .analysis {
            background: linear-gradient(135deg, #f0f7ff 0%, #e0f2ff 100%);
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
        }

        .analysis h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .analysis ul {
            margin-left: 20px;
            color: #555;
            line-height: 1.8;
        }

        .analysis li {
            margin-bottom: 8px;
        }

        .focus {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(102, 126, 234, 0.2);
            font-style: italic;
            color: #666;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        .timestamp {
            font-size: 0.9em;
            color: #999;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.9em;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Gaming Market Daily Digest</h1>
            <p class="subtitle">Click to generate market analysis</p>
        </header>

        <div class="control-panel">
            <button class="btn" id="generateBtn" onclick="generateDigest()">
                📊 Generate Digest Now
            </button>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Generating digest...</p>
            </div>
            <div class="error" id="error"></div>
        </div>

        <div class="results" id="results">
            <div class="metrics-grid" id="metricsGrid"></div>
            <div class="section">
                <h2>🚀 Top Movers</h2>
                <div class="movers-list" id="moversList"></div>
            </div>
            <div class="section">
                <h2>📊 Full Market Snapshot</h2>
                <table id="snapshotTable">
                    <thead>
                        <tr>
                            <th>Ticker</th>
                            <th>Company</th>
                            <th style="text-align: right;">Price</th>
                            <th style="text-align: right;">Change</th>
                            <th style="text-align: right;">%</th>
                        </tr>
                    </thead>
                    <tbody id="snapshotBody"></tbody>
                </table>
            </div>
            <div class="section">
                <h2>💡 Sector Analysis</h2>
                <div class="analysis" id="analysis"></div>
            </div>
            <div class="timestamp" id="timestamp"></div>
        </div>
    </div>

    <script>
        function generateDigest() {
            const data = {
                date: new Date().toISOString().split('T')[0],
                metrics: {
                    avg_change: -0.73,
                    gainers: 2,
                    losers: 4,
                    direction: "BEARISH",
                    direction_emoji: "📉"
                },
                movers: [
                    {
                        ticker: "FLUT",
                        name: "Flutter Entertainment",
                        price: 95.01,
                        change_pct: -3.11,
                        change_abs: -3.05,
                        emoji: "📉"
                    },
                    {
                        ticker: "DKNG",
                        name: "DraftKings",
                        price: 24.22,
                        change_pct: -2.26,
                        change_abs: -0.56,
                        emoji: "📉"
                    },
                    {
                        ticker: "EVOK.L",
                        name: "Evoke plc",
                        price: 46.40,
                        change_pct: 0.87,
                        change_abs: 0.40,
                        emoji: "📈"
                    }
                ],
                all_stocks: [
                    { ticker: "BALY", name: "Bally's Corporation", price: 9.10, change_pct: 0.11, change_abs: 0.01, emoji: "📈" },
                    { ticker: "DKNG", name: "DraftKings", price: 24.22, change_pct: -2.26, change_abs: -0.56, emoji: "📉" },
                    { ticker: "ENT.L", name: "Entain", price: 560.00, change_pct: 0.00, change_abs: 0.00, emoji: "➡️" },
                    { ticker: "EVOK.L", name: "Evoke plc", price: 46.40, change_pct: 0.87, change_abs: 0.40, emoji: "📈" },
                    { ticker: "FLUT", name: "Flutter Entertainment", price: 95.01, change_pct: -3.11, change_abs: -3.05, emoji: "📉" },
                    { ticker: "SGHC", name: "Super Group (Betway)", price: 13.31, change_pct: 0.00, change_abs: 0.00, emoji: "➡️" }
                ],
                analysis: {
                    sentiment: "BEARISH",
                    emoji: "🔴",
                    title: "Market Under Pressure",
                    headwinds: [
                        "Regulatory pressures (UK gaming taxes)",
                        "Slowing US sportsbook growth",
                        "Margin compression from promotions",
                        "Leadership transitions"
                    ],
                    tailwinds: [],
                    focus: "Consolidation among operators; smaller players at risk."
                }
            };

            displayDigest(data);
            document.getElementById('results').style.display = 'block';
        }

        function displayDigest(data) {
            const metrics = data.metrics;

            const metricsGrid = document.getElementById('metricsGrid');
            metricsGrid.innerHTML = `
                <div class="metric-card">
                    <div class="metric-label">Direction</div>
                    <div class="metric-value ${metrics.direction.toLowerCase()}">
                        ${metrics.direction_emoji} ${metrics.direction}
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Avg Change</div>
                    <div class="metric-value ${metrics.avg_change >= 0 ? 'bullish' : 'bearish'}">
                        ${metrics.avg_change > 0 ? '+' : ''}${metrics.avg_change.toFixed(2)}%
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Gainers/Losers</div>
                    <div class="metric-value">${metrics.gainers}/${metrics.losers}</div>
                </div>
            `;

            const moversList = document.getElementById('moversList');
            moversList.innerHTML = data.movers.map((mover, i) => `
                <div class="mover ${mover.change_pct >= 0 ? 'positive' : 'negative'}">
                    <div class="mover-info">
                        <div class="mover-ticker">${i + 1}. ${mover.emoji} ${mover.ticker}</div>
                        <div class="mover-company">${mover.name}</div>
                    </div>
                    <div class="mover-stats">
                        <div class="mover-price">$${mover.price.toFixed(2)}</div>
                        <div class="mover-change ${mover.change_pct >= 0 ? 'positive' : 'negative'}">
                            ${mover.change_pct > 0 ? '+' : ''}${mover.change_pct.toFixed(2)}%
                        </div>
                    </div>
                </div>
            `).join('');

            const snapshotBody = document.getElementById('snapshotBody');
            snapshotBody.innerHTML = data.all_stocks.map(stock => `
                <tr>
                    <td class="ticker-col">${stock.ticker}</td>
                    <td>${stock.name}</td>
                    <td style="text-align: right;">$${stock.price.toFixed(2)}</td>
                    <td style="text-align: right;" class="${stock.change_pct >= 0 ? 'positive-value' : 'negative-value'}">
                        ${stock.change_pct > 0 ? '+' : ''}${stock.change_abs.toFixed(2)}
                    </td>
                    <td style="text-align: right;" class="${stock.change_pct >= 0 ? 'positive-value' : 'negative-value'}">
                        ${stock.change_pct > 0 ? '+' : ''}${stock.change_pct.toFixed(2)}%
                    </td>
                </tr>
            `).join('');

            const analysis = data.analysis;
            const analysisDiv = document.getElementById('analysis');
            analysisDiv.innerHTML = `
                <h3>${analysis.emoji} ${analysis.sentiment} Sentiment - ${analysis.title}</h3>
                ${analysis.headwinds.length > 0 ? `
                    <h4>Headwinds:</h4>
                    <ul>
                        ${analysis.headwinds.map(h => `<li>${h}</li>`).join('')}
                    </ul>
                ` : ''}
                ${analysis.tailwinds.length > 0 ? `
                    <h4>Tailwinds:</h4>
                    <ul>
                        ${analysis.tailwinds.map(t => `<li>${t}</li>`).join('')}
                    </ul>
                ` : ''}
                <div class="focus"><strong>Strategic Focus:</strong> ${analysis.focus}</div>
            `;

            const timestamp = document.getElementById('timestamp');
            const time = new Date().toLocaleString();
            timestamp.textContent = `Generated: ${time}`;
        }
    </script>
</body>
</html>
